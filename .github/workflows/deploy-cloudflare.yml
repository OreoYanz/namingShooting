# Deploy docs/ to Cloudflare Worker on push to main.
# Requires GitHub Secrets (repo Settings → Secrets and variables → Actions):
#   TOKEN  = Cloudflare API Token (Edit Cloudflare Workers)
#   ID     = Cloudflare Account ID
name: Deploy Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-cloudflare.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.TOKEN }}
          accountId: ${{ secrets.ID }}
          command: deploy
