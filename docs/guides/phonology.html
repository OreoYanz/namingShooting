      <h2>音韻常看什麼</h2>
      <ul>
        <li>全名朗讀是否順口、有沒有卡頓或繞口。</li>
        <li>聲調搭配是否太平或過衝。</li>
        <li>是否容易與不好的諧音聯想。</li>
        <li>職場、學校點名時的清晰度與辨識度。</li>
      </ul>
